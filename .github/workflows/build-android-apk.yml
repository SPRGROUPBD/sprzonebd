name: Build SPR Zone BD APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".env.example"
      - "debug.keystore.base64"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android-apk"
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Android SDK and accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /opt/gradle
          rm -f /tmp/gradle-9.3.1-bin.zip
          echo "/opt/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Ensure environment file and keystores
        id: release_signing
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ -s debug.keystore.base64 ] && tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null && [ -s debug.keystore ]; then
            echo "Decoded debug.keystore from debug.keystore.base64"
          else
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '\r\n' | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            PASS="sprzonebdci2026"
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass "$PASS" -keypass "$PASS" -alias upload -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=SPR Zone BD,OU=Mobile,O=SPR ZONE BD,L=Dhaka,C=BD"
            echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Stage SPR Zone BD.apk artifacts
        run: |
          mkdir -p apk-output
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "apk-output/SPR Zone BD.apk"
          elif [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "apk-output/SPR Zone BD.apk"
          else
            echo "No APK produced!" && exit 1
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "apk-output/SPR Zone BD-debug.apk"
          fi
          ls -lh apk-output

      - name: Upload SPR Zone BD APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPR Zone BD APK
          path: apk-output/*.apk
          retention-days: 30

      - name: Publish SPR Zone BD.apk to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "apk-output/SPR Zone BD.apk" "apk-output/SPR Zone BD-debug.apk" --clobber
          else
            gh release create latest-apk "apk-output/SPR Zone BD.apk" "apk-output/SPR Zone BD-debug.apk" --title "SPR Zone BD APK (Latest)" --notes "Automated Android APK build for SPR Zone BD."
          fi
